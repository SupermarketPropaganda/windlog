<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>WindLog — Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirects 404 subpaths back to the index with query preservation
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background:#0a0a0f; color:#fff; font-family:sans-serif; text-align:center; padding-top:20vh;">
    <h2>✈ Loading WindLog...</h2>
  </body>
</html>
