<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0f" />
    
    <!-- iOS / iPadOS PWA Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WindLog" />
    <link rel="apple-touch-icon" href="favicon.svg" />
    
    <!-- Favicon & Manifest -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="manifest" href="manifest.json" />
    
    <!-- SEO & Social Sharing -->
    <title>WindLog — Tactile VFR Flight Planning & NavLog Engine</title>
    <meta name="description" content="Tactile VFR flight planning scratchpad, real-time winds aloft, WMM2025 magnetic declination, interactive tactical map, and aircraft fuel planning." />
    
    <!-- GitHub Pages Single Page App Redirect Restoration -->
    <script>
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>

    <script src="sql-wasm.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
